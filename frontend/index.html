<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relay connects local mutual aid groups with the funds that back them, without building a record of who needed help."
    />

    <!-- share-card:start - generated by marketing/build.mjs, do not edit by hand.
         The image filename carries a content hash because nginx serves .png from
         this tree with a one-year immutable cache, so a card edited under a
         stable name would keep showing the old image in every crawler that had
         already seen it. Rebuild with: node marketing/build.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relay" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://relayfunds.org/" />
    <meta property="og:title" content="Relay: mutual aid, connected" />
    <meta
      property="og:description"
      content="Relay connects local mutual aid groups with the funds that back them, without building a record of who needed help."
    />
    <meta property="og:image" content="https://relayfunds.org/share/relay-93ff4e21.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Relay. Mutual aid, connected." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Relay: mutual aid, connected" />
    <meta
      name="twitter:description"
      content="Relay connects local mutual aid groups with the funds that back them, without building a record of who needed help."
    />
    <meta name="twitter:image" content="https://relayfunds.org/share/relay-93ff4e21.png" />
    <!-- share-card:end -->

    <!-- Organization structured data. Static rather than injected at runtime so
         a crawler sees it without executing JavaScript. Deliberately NOT
         SoftwareApplication: Relay is not a product being sold, has no
         offers.priceRange, and docs/deck_audience_research.md is explicit that
         pitching it as SaaS misreads the audience it depends on. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Relay",
        "url": "https://relayfunds.org/",
        "logo": "https://relayfunds.org/logo.png",
        "description": "Relay connects local mutual aid groups with the funds that back them, without building a record of who needed help.",
        "sameAs": ["https://github.com/Flatts3000/relay"]
      }
    </script>

    <!-- app-head:start - generated by marketing/build.mjs, do not edit by hand.
         Self-hosted @font-face rules and the tab icon. This used to link
         fonts.googleapis.com, which sent every anonymous visitor's address to a
         third party on every page load (#80), and ask for /favicon.svg, which
         has never existed in this repository (#79).
         Rebuild with: node marketing/build.mjs -->
    <style>@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/inter-500.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/inter-600.woff2) format('woff2')}@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/inter-700.woff2) format('woff2')}</style>
    <link rel="icon" href="/share/icon-fde46152.png">
    <!-- app-head:end -->
    <title>Relay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
