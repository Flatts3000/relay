server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # The partner deck. Public, deliberately not indexed.
    #
    # Duplicated from deploy/nginx.prod.conf on purpose. Production bind-mounts
    # that file over this one, so this copy never serves a real visitor - but
    # without it the two configs disagree about whether /deck is indexable, and
    # the protection would vanish silently if the mount were ever dropped.
    # ^~ rather than a plain prefix: a matching regex location outranks a
    # non-exact prefix one whatever the file order, so without it the asset
    # block below would claim any future .png or .woff2 under /deck and serve
    # it indexable and immutably cached. The deck embeds everything today; ^~
    # means it stays correct when that stops being true.
    location ^~ /deck {
        # Repeated, not inherited. nginx applies add_header per level and it is
        # all-or-nothing: declaring one here discards every server-level header,
        # so omitting these would make the deck framable in exchange for the
        # noindex.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        absolute_redirect off;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
