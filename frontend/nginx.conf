# An access log with nothing in it that identifies a visitor.
#
# Duplicated from deploy/nginx.prod.conf on purpose, for the same reason the
# /deck block below is: production bind-mounts that file over this one, so this
# copy never serves a real visitor - but without it the two configs disagree
# about whether visitor addresses are recorded, and the protection would vanish
# silently if the mount were ever dropped. The root docker-compose.yml runs this
# config with no mount at all.
#
# nginx stock format ends with $http_user_agent and $http_x_forwarded_for, so
# every page load recorded who was asking. CLAUDE.md rules that out: no tracking
# of who browses the public directory, no IP logging on anonymous routes.
#
# Scope: this covers the access log. nginx also writes an error_log, which
# records "client: <address>" on error-level events such as an upstream refusing
# a connection. That is tracked separately.
log_format privacy '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log privacy;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Duplicated from deploy/nginx.prod.conf for the same reason as the access
    # log above and the /deck block below: production bind-mounts that file over
    # this one, but the two must not disagree, or the behaviour vanishes
    # silently if the mount is ever dropped.
    #
    # The public marketing pages are directories with an index.html, so a
    # request for /for-groups redirects to /for-groups/ before it is served.
    # nginx sits behind Caddy, which terminates TLS, so an absolute redirect
    # would send the browser to http://relayfunds.org/for-groups/, downgrading
    # the scheme and costing a second hop back through Caddy's HTTPS redirect.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Content Security Policy on the HTML document, which is the only place it
    # does anything. helmet sets a strict policy in backend/src/app.ts, but that
    # only ever reaches /api responses - JSON, which cannot execute a script,
    # load a font or embed a frame. The document that derives the group
    # passphrase and decrypts help requests had no policy at all.
    #
    # connect-src allows formspree.io because the contact form on the home page
    # posts there with fetch (frontend/src/pages/HomePage.tsx). Without it the
    # form fails silently, which is exactly how a CSP breaks a site.
    #
    # style-src needs 'unsafe-inline': the built app ships one inline <style>
    # and the marketing pages are entirely inline CSS. script-src does not - the
    # build emits no inline script, only a module with a src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # The partner deck. Public, deliberately not indexed.
    #
    # Duplicated from deploy/nginx.prod.conf on purpose. Production bind-mounts
    # that file over this one, so this copy never serves a real visitor - but
    # without it the two configs disagree about whether /deck is indexable, and
    # the protection would vanish silently if the mount were ever dropped.
    # ^~ rather than a plain prefix: a matching regex location outranks a
    # non-exact prefix one whatever the file order, so without it the asset
    # block below would claim any future .png or .woff2 under /deck and serve
    # it indexable and immutably cached. The deck embeds everything today; ^~
    # means it stays correct when that stops being true.
    location ^~ /deck {
        # Repeated, not inherited. nginx applies add_header per level and it is
        # all-or-nothing: declaring one here discards every server-level header,
        # so omitting these would make the deck framable in exchange for the
        # noindex.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # The deck is one self-contained file by design: its slide engine is an
        # inline <script> and its webfonts are base64 data: URIs, so it works
        # offline as an email attachment. The site-wide policy above blocks both,
        # and the failure is silent and total - 15 slides, none activated, a
        # blank page for anyone opening relayfunds.org/deck.
        #
        # So /deck gets its own policy: the inline script by hash rather than
        # 'unsafe-inline', and data: added to font-src. The hash covers the exact
        # bytes between <script> and </script> in the committed deck, and
        # deploy/check-nginx-parity.mjs recomputes it in CI, so rebuilding the
        # deck without updating this line fails the build instead of shipping a
        # blank deck to a funder.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Tzk7I7SESO6p0BU4btjcpZXKEISnc6aZjFXYEwy1sow='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        absolute_redirect off;
        try_files $uri $uri/ $uri/index.html =404;
    }



    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A real 404 for anything that asks for a file and is not one.
    #
    # The SPA fallback below returns index.html with status 200 for every path,
    # so nothing on this site has ever produced a 404. Google calls that a soft
    # 404: crawl budget goes on unlimited nonexistent URLs, any stale inbound
    # link becomes an indexable page whose content is the app shell, and nothing
    # can alert on a 404 rate that is structurally zero.
    #
    # Distinguishing an app route from a typo needs a route list, and a route
    # list in nginx drifts from App.tsx. This rule needs no list: no route in
    # App.tsx contains a dot, so a path with a file extension is never an app
    # route. If the file is not on disk, it is a 404 and saying so costs
    # nothing. Verified against App.tsx, which has zero routes containing '.'.
    #
    # Extensionless typos still reach the app, which renders its not-found view;
    # that view now carries a noindex so they cannot be indexed either.
    location ~ ^/.*\.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

}
