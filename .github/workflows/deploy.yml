name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    # The backend suite is an integration suite that talks to a real database,
    # and backend/.env.test points at localhost:5433. Without this service the
    # Test step below fails on connection refused, which would block every
    # deploy - safely, but for entirely the wrong reason.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply schema to the test database
        run: npx tsx ../node_modules/drizzle-kit/bin.cjs push --force
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: relay_test
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/relay
            /opt/relay/deploy/deploy.sh

      # Verifies readiness, not liveness. /api/health answers 200 whenever the
      # process is up and checks no dependency, so verifying against it reported
      # "Deployment verified!" for an API where every database-backed route was
      # failing. /api/health/ready executes a query and returns 503 when it
      # cannot. See #18.
      #
      # Against the domain, not secrets.EC2_HOST. That secret holds the instance
      # address for SSH, and https:// to a bare IP fails the TLS handshake
      # outright - Caddy serves a certificate for relayfunds.org and rejects the
      # mismatched connection, so even -k cannot rescue it. Verifying through the
      # real hostname is also the better test: it exercises DNS, the certificate,
      # Caddy and the app the way a visitor would.
      - name: Verify deployment
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "https://relayfunds.org/api/health/ready" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deployment verified!"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying..."
            sleep 5
          done
          echo "Deployment verification failed!"
          exit 1

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment to production failed! Check EC2 logs."
