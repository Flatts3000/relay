name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/relay
            /opt/relay/deploy/deploy.sh

      # Verifies readiness, not liveness. /api/health answers 200 whenever the
      # process is up and checks no dependency, so verifying against it reported
      # "Deployment verified!" for an API where every database-backed route was
      # failing. /api/health/ready executes a query and returns 503 when it
      # cannot. See #18.
      - name: Verify deployment
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.EC2_HOST }}/api/health/ready" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deployment verified!"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying..."
            sleep 5
          done
          echo "Deployment verification failed!"
          exit 1

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment to production failed! Check EC2 logs."
