name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Lint backend
        run: npm run lint:backend

      - name: Typecheck frontend
        run: npm run typecheck --workspace=frontend

      - name: Typecheck backend
        run: npm run typecheck --workspace=backend

      # A migration missing from the journal is never applied, and the deploy
      # still reports success. That went unnoticed for three migrations over six
      # months. See #26.
      - name: Check migration journal
        run: npm run db:check-journal --workspace=backend

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:frontend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    # The backend suite is an integration suite: it talks to a real PostgreSQL.
    # backend/.env.test points at localhost:5433, so the service is mapped there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Built by running the migrations, not by pushing the schema definitions.
      #
      # `push` derives the schema from the TypeScript definitions; production
      # gets whatever the SQL in drizzle/ produces. Where the two disagree the
      # suite was testing a schema nobody runs. That is not hypothetical: a CHECK
      # constraint added in a migration and not mirrored in the schema existed in
      # production and nowhere any test could see it, and `push` is separately
      # known to leave a *changed* CHECK constraint alone while reporting success
      # (#37), so a long-lived database silently keeps the weaker one.
      #
      # Running migrate here makes the tested schema the deployed schema. The
      # database is fresh every run, so there is no already-pushed state for it
      # to trip over.
      - name: Apply migrations to test database
        run: npm run db:migrate
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: relay_test
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Run tests
        run: npm run test:backend

      # The only thing that can tell us the generate baseline is still current is
      # generate itself. With an accurate snapshot it writes nothing and says
      # "No schema changes"; with a stale one it emits a migration re-creating
      # everything added since - which is what #37 was.
      #
      # A stale baseline can also make it prompt about an ambiguous rename. stdin
      # is closed, so that fails rather than hangs, which is the outcome we want.
      - name: Check the generate baseline is current
        run: |
          npx tsx ../node_modules/drizzle-kit/bin.cjs generate --name ci_staleness_probe < /dev/null
          if ! git diff --quiet --exit-code -- drizzle; then
            echo "::error::drizzle-kit generate wrote changes, so meta/ is stale."
            echo "The newest snapshot no longer reflects the schema; regenerate it."
            git --no-pager diff --stat -- drizzle
            exit 1
          fi
        working-directory: backend

  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    # Applies the migrations to a fresh database, re-applies them to check they
    # are idempotent, and diffs the resulting columns against what
    # `drizzle-kit push` builds.
    #
    # Note the limits of that diff: it compares table.column:data_type from
    # information_schema and nothing else, so nullability, defaults, indexes,
    # CHECK constraints and enum values are NOT compared. A constraint present in
    # one path and absent from the other still passes this job - which is exactly
    # the bug class that motivated #37, so do not read a green run here as
    # "the two paths agree". The idempotency re-apply is the part nothing else
    # covers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay_migrate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to an empty database
        run: npx tsx ../node_modules/drizzle-kit/bin.cjs migrate
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: relay_migrate
          DB_USER: postgres
          DB_PASSWORD: postgres

      # Re-running must be a no-op. A database where migrations were applied by
      # hand has no drizzle migration record, so migrate will run them again;
      # this is the only place that path is exercised.
      - name: Re-apply every migration by hand
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          for f in backend/drizzle/*.sql; do
            case "$(basename "$f")" in
              000[012]_*) echo "skip $(basename "$f") (pre-dates the idempotency work)"; continue ;;
            esac
            echo "re-applying $(basename "$f")"
            psql -h localhost -p 5433 -U postgres -d relay_migrate -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Dump the schema built by migrations
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h localhost -p 5433 -U postgres -d relay_migrate -tAc             "SELECT table_name||'.'||column_name||':'||data_type FROM information_schema.columns              WHERE table_schema='public' AND table_name<>'__drizzle_migrations' ORDER BY 1"             > "$RUNNER_TEMP/from-migrations.txt"
          psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE relay_from_schema"

      # drizzle-kit resolves the config's schema path relative to the working
      # directory, not to the config file, so this has to run from backend/.
      - name: Build the same schema from the schema definition
        run: npx tsx ../node_modules/drizzle-kit/bin.cjs push --force
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: relay_from_schema
          DB_USER: postgres
          DB_PASSWORD: postgres

      # If these disagree, the migration chain and the schema definition have
      # drifted, which is how a deploy can succeed and still leave the running
      # code without the tables it expects.
      - name: Compare them
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          psql -h localhost -p 5433 -U postgres -d relay_from_schema -tAc             "SELECT table_name||'.'||column_name||':'||data_type FROM information_schema.columns              WHERE table_schema='public' ORDER BY 1" > "$RUNNER_TEMP/from-schema.txt"
          diff "$RUNNER_TEMP/from-migrations.txt" "$RUNNER_TEMP/from-schema.txt"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-frontend, test-backend, migrations]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          push: false
          tags: relay-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          push: false
          tags: relay-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # 1.6.0 can no longer run terraform init: HashiCorp's provider signing
          # key expired, and releases from that era fail verification with
          # "openpgp: key expired" before any validation happens. 1.16 ships the
          # current key.
          terraform_version: 1.16.0

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: ./infra
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: '/language:javascript-typescript'

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build frontend image for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: relay-frontend:scan

      - name: Build backend image for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          push: false
          load: true
          tags: relay-backend:scan

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master as of 2026-08-28
        with:
          image-ref: 'relay-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master as of 2026-08-28
        with:
          image-ref: 'relay-backend:scan'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      # Uploaded separately, one category per image. Pointing sarif_file at '.'
      # bundled both results into a single upload under one category, which code
      # scanning stopped accepting in July 2025:
      # https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/
      - name: Upload Trivy scan results (frontend)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'container-scan-frontend'

      - name: Upload Trivy scan results (backend)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'container-scan-backend'
