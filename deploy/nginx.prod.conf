server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The partner deck. Public, deliberately not indexed.
    #
    # X-Robots-Tag rather than a robots.txt Disallow, and the two are not
    # interchangeable: Disallow stops a crawler fetching the page, which means it
    # never sees the noindex, and the URL can still surface in results from an
    # external link. Letting it be fetched and serving noindex is what actually
    # keeps it out. The document carries the same directive in a meta tag; this
    # covers clients that never parse the HTML.
    location /deck {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Relative redirects. nginx sits behind Caddy, which terminates TLS, so
        # nginx only ever sees plain HTTP - and an absolute redirect to /deck/
        # would send the browser to http://relayfunds.org, downgrading the scheme
        # and costing a second hop back through Caddy's HTTPS redirect. A
        # relative Location resolves against whatever the browser is already on.
        absolute_redirect off;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Health check endpoint
    location = /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
