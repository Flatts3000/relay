# An access log with nothing in it that identifies a visitor.
#
# nginx's stock format ends with "$http_user_agent" "$http_x_forwarded_for", and
# Caddy appends the real client address to X-Forwarded-For before proxying here.
# So every page load - including an anonymous visitor opening /directory - wrote
# that person's IP and browser string to stdout, which Docker persists on the
# host with no rotation. That is precisely what CLAUDE.md rules out: no tracking
# of who browses the public directory, no IP logging on anonymous routes.
#
# Method, path, status, size and timing are what this log is actually read for,
# and none of them says who was asking. $remote_addr is omitted too: it is only
# ever Caddy's container address, so it identifies nothing and reads as though
# it might.
log_format privacy '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log privacy;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The partner deck. Public, deliberately not indexed.
    #
    # X-Robots-Tag rather than a robots.txt Disallow, and the two are not
    # interchangeable: Disallow stops a crawler fetching the page, which means it
    # never sees the noindex, and the URL can still surface in results from an
    # external link. Letting it be fetched and serving noindex is what actually
    # keeps it out. The document carries the same directive in a meta tag; this
    # covers clients that never parse the HTML.
    # ^~ rather than a plain prefix: a matching regex location outranks a
    # non-exact prefix one whatever the file order, so without it the asset
    # block above would claim any future .png or .woff2 under /deck and serve
    # it indexable and immutably cached. The deck embeds everything today; ^~
    # means it stays correct when that stops being true.
    location ^~ /deck {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Relative redirects. nginx sits behind Caddy, which terminates TLS, so
        # nginx only ever sees plain HTTP - and an absolute redirect to /deck/
        # would send the browser to http://relayfunds.org, downgrading the scheme
        # and costing a second hop back through Caddy's HTTPS redirect. A
        # relative Location resolves against whatever the browser is already on.
        absolute_redirect off;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Health check endpoint
    location = /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
